<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园活动系统 E-R 图</title>
  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif;
    }

    .wrap {
      width: 2200px;
      margin: 0 auto;
      background: #ffffff;
    }

    svg {
      display: block;
      width: 2200px;
      height: 1500px;
      background: #ffffff;
    }

    .entity {
      fill: #ffffff;
      stroke: #2c4a72;
      stroke-width: 2.2;
      rx: 14;
      ry: 14;
    }

    .entity-head {
      fill: #dfeaf7;
      stroke: #2c4a72;
      stroke-width: 2.2;
      rx: 14;
      ry: 14;
    }

    .line {
      stroke: #4d6484;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title {
      font-size: 34px;
      font-weight: 700;
      fill: #163254;
    }

    .entity-title {
      font-size: 24px;
      font-weight: 700;
      fill: #17365d;
    }

    .entity-sub {
      font-size: 12px;
      fill: #6d809a;
      letter-spacing: 0.4px;
    }

    .field {
      font-size: 18px;
      fill: #223449;
    }

    .card {
      font-size: 18px;
      font-weight: 700;
      fill: #395372;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 2200 1500" xmlns="http://www.w3.org/2000/svg">
      <text x="70" y="56" class="title">校园活动系统数据库 E-R 图</text>

      <g>
        <path class="line" d="M260 280 L260 350" />
        <text x="210" y="325" class="card">1:N</text>

        <path class="line" d="M260 540 L260 610" />
        <text x="210" y="592" class="card">1:1</text>

        <path class="line" d="M260 810 L260 880" />
        <text x="210" y="860" class="card">1:N</text>

        <path class="line" d="M490 445 L630 445 L630 240 L820 240" />
        <text x="625" y="350" class="card">1:1</text>

        <path class="line" d="M490 445 L820 445" />
        <text x="645" y="420" class="card">1:N</text>

        <path class="line" d="M490 445 L650 445 L650 715 L820 715" />
        <text x="648" y="620" class="card">1:N</text>

        <path class="line" d="M490 445 L670 445 L670 985 L820 985" />
        <text x="645" y="900" class="card">1:N</text>

        <path class="line" d="M490 445 L610 445 L610 1240 L820 1240" />
        <text x="615" y="1160" class="card">1:N</text>

        <path class="line" d="M1240 445 L1320 445 L1320 255 L1470 255" />
        <text x="1220" y="334" class="card">M:N</text>

        <path class="line" d="M1370 260 C1420 260, 1420 450, 1470 450" />
        <text x="1385" y="362" class="card">1:N</text>

        <path class="line" d="M1220 450 L1470 450" />
        <text x="1310" y="425" class="card">M:N</text>

        <path class="line" d="M1240 470 L1340 470 L1340 725 L1470 725" />
        <text x="1290" y="626" class="card">1:1</text>

        <path class="line" d="M1240 495 L1360 495 L1360 995 L1470 995" />
        <text x="1298" y="900" class="card">1:N</text>

        <path class="line" d="M1240 520 L1380 520 L1380 1225 L1470 1225" />
        <text x="1288" y="1134" class="card">1:N</text>

        <path class="line" d="M1240 525 L1280 525 L1280 450 L1470 450" />
        <text x="1202" y="485" class="card">1:N</text>

        <path class="line" d="M1200 715 L1470 715" />
        <text x="1222" y="690" class="card">1:N</text>

        <path class="line" d="M1200 735 L1300 735 L1300 995 L1470 995" />
        <text x="1210" y="900" class="card">1:N</text>
      </g>

      <g transform="translate(70,100)">
        <rect class="entity" x="0" y="0" width="380" height="180" />
        <rect class="entity-head" x="0" y="0" width="380" height="50" />
        <text x="18" y="32" class="entity-title">认证令牌</text>
        <text x="18" y="46" class="entity-sub">auth_tokens</text>
        <text x="22" y="92" class="field">PK id</text>
        <text x="22" y="124" class="field">FK user_id</text>
        <text x="22" y="156" class="field">令牌类型 / 过期时间 / 是否撤销</text>
      </g>

      <g transform="translate(70,350)">
        <rect class="entity" x="0" y="0" width="420" height="190" />
        <rect class="entity-head" x="0" y="0" width="420" height="50" />
        <text x="18" y="32" class="entity-title">用户</text>
        <text x="18" y="46" class="entity-sub">users</text>
        <text x="22" y="90" class="field">PK id</text>
        <text x="22" y="122" class="field">用户名 / 微信 openid / 手机号</text>
        <text x="22" y="154" class="field">角色 role / 状态 status</text>
      </g>

      <g transform="translate(70,610)">
        <rect class="entity" x="0" y="0" width="380" height="180" />
        <rect class="entity-head" x="0" y="0" width="380" height="50" />
        <text x="18" y="32" class="entity-title">学生资料</text>
        <text x="18" y="46" class="entity-sub">student_profiles</text>
        <text x="22" y="92" class="field">PK/FK user_id</text>
        <text x="22" y="124" class="field">学号 / 真实姓名</text>
        <text x="22" y="156" class="field">学院 / 专业</text>
      </g>

      <g transform="translate(70,880)">
        <rect class="entity" x="0" y="0" width="380" height="180" />
        <rect class="entity-head" x="0" y="0" width="380" height="50" />
        <text x="18" y="32" class="entity-title">登录日志</text>
        <text x="18" y="46" class="entity-sub">login_logs</text>
        <text x="22" y="92" class="field">PK id</text>
        <text x="22" y="124" class="field">FK user_id</text>
        <text x="22" y="156" class="field">登录结果 / 登录时间</text>
      </g>

      <g transform="translate(820,160)">
        <rect class="entity" x="0" y="0" width="380" height="160" />
        <rect class="entity-head" x="0" y="0" width="380" height="50" />
        <text x="18" y="32" class="entity-title">组织者资料</text>
        <text x="18" y="46" class="entity-sub">organizer_profiles</text>
        <text x="22" y="92" class="field">PK/FK user_id</text>
        <text x="22" y="124" class="field">组织名称 / 组织类型 / 认证状态</text>
      </g>

      <g transform="translate(820,350)">
        <rect class="entity" x="0" y="0" width="420" height="210" />
        <rect class="entity-head" x="0" y="0" width="420" height="50" />
        <text x="18" y="32" class="entity-title">活动</text>
        <text x="18" y="46" class="entity-sub">activities</text>
        <text x="22" y="90" class="field">PK id</text>
        <text x="22" y="122" class="field">FK organizer_id / publisher_id</text>
        <text x="22" y="154" class="field">活动标题 / 开始时间 / 结束时间</text>
        <text x="22" y="186" class="field">人数上限 / 活动状态 / 可见性</text>
      </g>

      <g transform="translate(820,620)">
        <rect class="entity" x="0" y="0" width="380" height="190" />
        <rect class="entity-head" x="0" y="0" width="380" height="50" />
        <text x="18" y="32" class="entity-title">报名记录</text>
        <text x="18" y="46" class="entity-sub">activity_registrations</text>
        <text x="22" y="90" class="field">PK id</text>
        <text x="22" y="122" class="field">FK activity_id / user_id</text>
        <text x="22" y="154" class="field">报名状态 / 报名时间 / 签到时间</text>
      </g>

      <g transform="translate(820,890)">
        <rect class="entity" x="0" y="0" width="380" height="160" />
        <rect class="entity-head" x="0" y="0" width="380" height="50" />
        <text x="18" y="32" class="entity-title">收藏</text>
        <text x="18" y="46" class="entity-sub">activity_favorites</text>
        <text x="22" y="92" class="field">PK id</text>
        <text x="22" y="124" class="field">FK activity_id / user_id</text>
      </g>

      <g transform="translate(820,1160)">
        <rect class="entity" x="0" y="0" width="400" height="160" />
        <rect class="entity-head" x="0" y="0" width="400" height="50" />
        <text x="18" y="32" class="entity-title">关注组织者</text>
        <text x="18" y="46" class="entity-sub">organizer_follows</text>
        <text x="22" y="92" class="field">PK id</text>
        <text x="22" y="124" class="field">FK organizer_id / user_id</text>
      </g>

      <g transform="translate(1470,170)">
        <rect class="entity" x="0" y="0" width="380" height="170" />
        <rect class="entity-head" x="0" y="0" width="380" height="50" />
        <text x="18" y="32" class="entity-title">分类</text>
        <text x="18" y="46" class="entity-sub">activity_categories</text>
        <text x="22" y="92" class="field">PK id / FK parent_id</text>
        <text x="22" y="124" class="field">分类名称 / 排序号 / 状态</text>
      </g>

      <g transform="translate(1470,360)">
        <rect class="entity" x="0" y="0" width="380" height="170" />
        <rect class="entity-head" x="0" y="0" width="380" height="50" />
        <text x="18" y="32" class="entity-title">活动分类关联</text>
        <text x="18" y="46" class="entity-sub">activity_category_rel</text>
        <text x="22" y="92" class="field">PK/FK activity_id</text>
        <text x="22" y="124" class="field">PK/FK category_id</text>
      </g>

      <g transform="translate(1470,640)">
        <rect class="entity" x="0" y="0" width="380" height="170" />
        <rect class="entity-head" x="0" y="0" width="380" height="50" />
        <text x="18" y="32" class="entity-title">当前审核</text>
        <text x="18" y="46" class="entity-sub">activity_reviews</text>
        <text x="22" y="92" class="field">PK/FK activity_id</text>
        <text x="22" y="124" class="field">FK reviewer_id / 审核状态</text>
      </g>

      <g transform="translate(1470,910)">
        <rect class="entity" x="0" y="0" width="380" height="170" />
        <rect class="entity-head" x="0" y="0" width="380" height="50" />
        <text x="18" y="32" class="entity-title">审核日志</text>
        <text x="18" y="46" class="entity-sub">activity_audit_logs</text>
        <text x="22" y="92" class="field">PK id</text>
        <text x="22" y="124" class="field">FK activity_id / operator_id</text>
      </g>

      <g transform="translate(1470,1140)">
        <rect class="entity" x="0" y="0" width="380" height="170" />
        <rect class="entity-head" x="0" y="0" width="380" height="50" />
        <text x="18" y="32" class="entity-title">发布人关联</text>
        <text x="18" y="46" class="entity-sub">activities.publisher_id</text>
        <text x="22" y="92" class="field">一个用户可发布多个活动</text>
        <text x="22" y="124" class="field">用于体现 publisher_id 业务关系</text>
      </g>
    </svg>
  </div>
</body>
</html>
