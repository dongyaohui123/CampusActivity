spring:
  application:
    name: activity-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_activity_v2?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.campus.activity.entity,com.campus.activity.entity.view
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    call-setters-on-nulls: true

logging:
  level:
    com.campus.activity.mapper: debug

wechat:
  miniapp:
    appid: wx89bee6c990f52064
    secret: 59a101a98efc3f34564bd75724fcaf7c

app:
  upload:
    avatar-dir: ${APP_UPLOAD_AVATAR_DIR:./uploads/avatars}
    avatar-url-prefix: ${APP_UPLOAD_AVATAR_URL_PREFIX:/static/avatars}
    avatar-max-size-kb: ${APP_UPLOAD_AVATAR_MAX_SIZE_KB:1024}
    activity-cover-dir: ${APP_UPLOAD_ACTIVITY_COVER_DIR:./uploads/activity-covers}
    activity-cover-url-prefix: ${APP_UPLOAD_ACTIVITY_COVER_URL_PREFIX:/static/activity-covers}
    activity-cover-max-size-kb: ${APP_UPLOAD_ACTIVITY_COVER_MAX_SIZE_KB:2048}
    public-base-url: ${APP_UPLOAD_PUBLIC_BASE_URL:http://127.0.0.1:8080}
